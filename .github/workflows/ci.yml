name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NEXT_PUBLIC_SANITY_PROJECT_ID: "5cr26y9m"
  NEXT_PUBLIC_SANITY_DATASET: "production"
  NEXT_PUBLIC_SANITY_STUDIO_URL: "/studio"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
